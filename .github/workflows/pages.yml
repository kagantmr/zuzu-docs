name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build 2.x
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r requirements.txt
          mkdocs build --strict --site-dir _site/2.x

      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: v1

      - name: Build 1.x
        working-directory: v1
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl /zuzu-docs/1.x --destination ../_site/1.x

      - name: Version list and redirect
        run: |
          cat > _site/versions.json <<'EOF'
          [
            {"version": "2.x", "title": "2.x Prowl", "aliases": ["latest"]},
            {"version": "1.x", "title": "1.x Loaf", "aliases": []}
          ]
          EOF
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>zuzu</title>
          <meta http-equiv="refresh" content="0; url=/zuzu-docs/2.x/">
          <link rel="canonical" href="/zuzu-docs/2.x/">
          <a href="/zuzu-docs/2.x/">zuzu documentation</a>
          EOF
          cp _site/index.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
